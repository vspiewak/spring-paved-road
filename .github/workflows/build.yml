name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # not ubuntu-latest : its 7.0.0-azure kernel makes mongo:8.0 refuse to start (SERVER-131779, fixed in 8.0.37)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # the full lane : unit + slice + *IT (Testcontainers) + coverage
      - run: ./mvnw -ntp verify
